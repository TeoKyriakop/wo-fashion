name: Build Android (WO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Έκδοση (π.χ. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: WO/wo-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Γράψιμο config.json με τη διεύθυνση των άρθρων (GitHub Pages)
        run: echo "{\"dataBase\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" > www/config.json

      - name: Εγκατάσταση & δημιουργία Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Αριθμός έκδοσης
        run: |
          CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle

      - name: Keystore (υπογραφή)
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Build APK + AAB
        working-directory: WO/wo-app/app/android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEY" = "true" ]; then
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks \
              -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
              -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
              -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'
          else
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wo-fashion-${{ inputs.version }}-${{ github.run_number }}
          path: |
            WO/wo-app/app/android/app/build/outputs/apk/**/*.apk
            WO/wo-app/app/android/app/build/outputs/bundle/**/*.aab
