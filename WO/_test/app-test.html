<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App test</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style>
<iframe id="f"></iframe>
<script type="module">
import { FEEDS } from "/wo-app/fetcher/feeds.js";
import { parseFeed } from "/wo-app/fetcher/parse.js";
import { classify } from "/wo-app/fetcher/topics.js";

const reels = [];
for (let i = 0; i < FEEDS.length; i++) {
  const feed = FEEDS[i];
  let items = [];
  try { items = parseFeed(await (await fetch(`/_test/feeds/${i}.xml`)).text(), feed); } catch {}
  for (const it of items) {
    const category = classify(it, feed);
    if (category) reels.push({ id: it.id, category, lang: feed.lang, source: feed.name, url: it.link, image: it.image,
      title: it.title, excerpt: it.excerpt, published: new Date(it.date).toISOString() });
  }
}
reels.sort((a, b) => Date.parse(b.published) - Date.parse(a.published));
const today = new Date().toLocaleDateString("en-CA");
const y = new Date(); y.setDate(y.getDate() - 1); const yesterday = y.toLocaleDateString("en-CA");
window.__DATA = {
  "data/days.json": [today, yesterday],
  [`data/day/${today}.json`]: reels.slice(0, 250),
  [`data/day/${yesterday}.json`]: reels.slice(250),
  "data/search.json": reels,
};

let html = await (await fetch("/wo-app/app/www/index.html")).text();
const hook = `<base href="/wo-app/app/www/"><script>
  const D = parent.__DATA, orig = window.fetch.bind(window);
  window.fetch = async (u, o) => {
    u = String(u);
    if (u.includes("config.json")) return new Response(JSON.stringify({ dataBase: "https://example.test/" }));
    for (const k in D) if (u.includes(k)) return new Response(JSON.stringify(D[k]));
    return orig(u, o);
  };
<\/script>`;
html = html.replace("<head>", "<head>" + hook);
document.getElementById("f").srcdoc = html;
</script>
