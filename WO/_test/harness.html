<!doctype html>
<meta charset="utf-8">
<title>Fetcher test</title>
<pre id="out">running…</pre>
<script type="module">
import { FEEDS } from "/wo-app/fetcher/feeds.js";
import { parseFeed } from "/wo-app/fetcher/parse.js";
import { classify } from "/wo-app/fetcher/topics.js";

const report = { feeds: [], totals: {}, samples: {}, dropped: [] };
const reels = [];
for (let i = 0; i < FEEDS.length; i++) {
  const feed = FEEDS[i];
  let items = [];
  try {
    const xml = await (await fetch(`/_test/feeds/${i}.xml`)).text();
    items = parseFeed(xml, feed);
  } catch (e) { report.feeds.push(`${feed.name}: ERROR ${e}`); continue; }
  let kept = 0, img = 0, noTitle = 0, noLink = 0, noEx = 0;
  for (const it of items) {
    if (!it.title) noTitle++; if (!it.link) noLink++; if (!it.excerpt) noEx++;
    const c = classify(it, feed);
    if (c) {
      kept++; if (it.image) img++;
      report.totals[c] = (report.totals[c] || 0) + 1;
      reels.push({ c, lang: feed.lang, source: feed.name, title: it.title, excerpt: it.excerpt, image: it.image, url: it.link, published: new Date(it.date).toISOString() });
    } else report.dropped.push(`[${feed.name}] ${it.title}`);
  }
  report.feeds.push(`${feed.name}: items=${items.length} kept=${kept} img=${img} noTitle=${noTitle} noLink=${noLink} noExcerpt=${noEx}`);
}
for (const r of reels) { const k = r.c + "/" + r.lang; (report.samples[k] ||= []); if (report.samples[k].length < (r.lang === "el" || r.c === "products" ? 25 : 8)) report.samples[k].push(`[${r.source}] ${r.title}`); }
report.dropped = report.dropped.filter((d) => d.includes("Greece") || d.includes(".gr") || d.includes("Idol") || d.includes("Jenny"));
window.__reels = reels;
document.getElementById("out").textContent = JSON.stringify(report, null, 1);
</script>
