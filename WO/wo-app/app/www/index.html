<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1416">
<title>WO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#1c1416; --ink:#fff7f3; --muted:#cdb9b4; --rose:#e8a4a0; --rose-deep:#c46d6a;
  --gold:#d9b779; --cream:#faf3ee; --paper:#fffaf7; --text:#2a1f21; --text-soft:#7a6a6c;
  --line:#eadbd5; --chip:#f3e6e0;
  --fashion:#c46d6a; --beauty:#b0699a; --health:#5f9b82; --products:#c09042;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.top{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:linear-gradient(to bottom,rgba(20,12,14,.85),rgba(20,12,14,0));}
.row{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.5px;line-height:1}
.brand i{color:var(--rose);font-style:italic;font-weight:500}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lang{height:38px;padding:0 12px;border-radius:19px;background:rgba(255,255,255,.12);font-weight:700;font-size:13px;letter-spacing:.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.day-label{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}

/* ---------- Feed ---------- */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.horizontal{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory}
.reel{position:relative;height:100%;min-height:100%;width:100%;flex:none;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#2b1f22}
.reel .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.reel .bg.fallback{display:grid;place-items:center}
.reel .bg.fallback span{font-family:var(--serif);font-size:42vmin;font-style:italic;color:rgba(255,255,255,.09);line-height:1}
.reel .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,14,.55) 0%,rgba(20,12,14,0) 28%,rgba(20,12,14,.15) 45%,rgba(20,12,14,.93) 78%)}
.reel .body{position:absolute;left:0;right:64px;bottom:calc(var(--safe-bottom) + 92px);padding:0 18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:5px 10px;border-radius:12px;color:#fff}
.reel h2{font-family:var(--serif);font-weight:700;font-size:clamp(23px,6.3vw,32px);line-height:1.18;margin:12px 0 10px;text-wrap:balance}
.reel p{margin:0 0 12px;font-size:15px;line-height:1.5;color:#f3e7e3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.read{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:24px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}
.read.light{background:rgba(255,255,255,.18);color:var(--ink);backdrop-filter:blur(10px)}
.sum-img{height:190px;border-radius:16px;background-size:cover;background-position:center;margin:0 0 14px}
.sum h3{margin:10px 0 4px;line-height:1.25}
.sum-text{font-size:15.5px;line-height:1.6;margin:14px 0 10px;color:var(--text)}
.sum-actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.sum-actions .done{margin-top:0;flex:1}
.sum-save{width:50px;height:50px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.sum-save svg{width:22px;height:22px;stroke:var(--rose-deep);fill:none;stroke-width:1.8}
.sum-save.saved svg{fill:var(--rose-deep)}
.sheet{scrollbar-width:none}
.tsec{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--text-soft);margin:18px 2px 8px;text-align:left}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:8px 12px;font-size:13.5px;color:var(--text)}
.tchip small{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--text-soft)}
.side{position:absolute;right:12px;bottom:calc(var(--safe-bottom) + 104px);display:flex;flex-direction:column;gap:14px}
.side .icon-btn{width:44px;height:44px}
.side .icon-btn.saved{background:var(--rose-deep)}
.side .icon-btn.saved svg{fill:#fff}
.end{height:100%;min-height:100%;width:100%;flex:none;scroll-snap-align:start;display:grid;place-items:center;text-align:center;padding:40px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--rose);animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 128px);z-index:25;background:var(--rose);color:#2a1416;font-weight:700;font-size:13px;padding:9px 16px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* ---------- Ask button ---------- */
.ask-fab{position:absolute;left:16px;right:16px;bottom:calc(var(--safe-bottom) + 18px);z-index:30;height:56px;border-radius:28px;
  background:linear-gradient(135deg,var(--rose),var(--gold));color:#2a1416;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ask-fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,5,6,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:75%;overflow:auto;background:var(--paper);color:var(--text);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--safe-bottom) + 20px)}
.sheet h3{font-family:var(--serif);font-size:22px;margin:4px 0 4px}
.sheet h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-soft);margin:18px 0 8px}
.sheet .sub{color:var(--text-soft);font-size:13px;margin-bottom:14px}
.day-btn{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.day-btn small{color:var(--text-soft)}
.day-btn.on{color:var(--rose-deep);font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--text-soft)}
.seg button.on{background:var(--paper);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.done{margin-top:20px;width:100%;padding:14px;border-radius:14px;background:var(--text);color:var(--cream);font-weight:700}

/* ---------- Search (Ρώτα τη WO) ---------- */
#ask{background:var(--cream);color:var(--text)}
.ask-top{padding:calc(var(--safe-top) + 10px) 12px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.ask-top .icon-btn{background:var(--chip);color:var(--text)}
.ask-title{font-family:var(--serif);font-size:21px;font-weight:700}
.ask-title small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text-soft)}
.searchbox{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:0 6px 0 16px}
.searchbox:focus-within{border-color:var(--rose)}
.searchbox input{flex:1;border:0;background:none;font:inherit;font-size:15.5px;padding:12px 0;outline:none;color:var(--text);min-width:0}
.go{width:40px;height:40px;border-radius:50%;background:var(--rose-deep);color:#fff;display:grid;place-items:center;flex:none}
.go svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.results{flex:1;overflow-y:auto;padding:16px 16px calc(var(--safe-bottom) + 20px)}
.hello{text-align:center;padding:10px 4px 8px}
.hello .mark{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose),var(--gold));font-family:var(--serif);font-weight:700;font-size:22px;color:#2a1416}
.hello h3{font-family:var(--serif);font-size:23px;margin:0 0 6px}
.hello p{color:var(--text-soft);margin:0 0 18px;font-size:14.5px;line-height:1.5}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13.5px;line-height:1.35}
.topic b{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
.recent button{background:var(--chip);border-radius:16px;padding:7px 12px;font-size:13px}
.res-head{font-size:13px;color:var(--text-soft);margin:4px 2px 12px}
.res-head.sep{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.card{display:flex;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.card .thumb{width:92px;height:92px;border-radius:12px;flex:none;background-size:cover;background-position:center}
.card .ct{flex:1;min-width:0}
.card .ct .tag{font-size:9.5px;padding:3px 7px;border-radius:8px}
.card h5{font-family:var(--serif);font-size:16px;line-height:1.25;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0 0 4px;font-size:12.5px;line-height:1.4;color:var(--text-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{font-size:11.5px;color:var(--text-soft)}
.none{text-align:center;color:var(--text-soft);padding:30px 10px;line-height:1.5}
.loading{display:grid;place-items:center;padding:40px}
.loading .spinner{border-color:var(--line);border-top-color:var(--rose-deep)}
</style>
</head>
<body>

<!-- ================= FEED ================= -->
<section id="home" class="screen">
  <header class="top">
    <div class="row">
      <div class="brand">W<i>O</i></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="layoutBtn" aria-label="Layout"></button>
      <button class="icon-btn" id="archiveBtn" aria-label="Archive">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      </button>
      <button class="lang" id="langBtn">ΕΛ</button>
    </div>
    <nav class="chips" id="chips"></nav>
    <div class="day-label" id="dayLabel"></div>
  </header>

  <main class="feed" id="feed"></main>
  <div class="pill hidden" id="newPill"></div>

  <button class="ask-fab" id="askBtn">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span id="askBtnText"></span>
  </button>
</section>

<!-- ================= Ρώτα τη WO (αναζήτηση) ================= -->
<section id="ask" class="screen hidden">
  <header class="ask-top">
    <div class="row">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="ask-title"><span id="askTitle"></span><small id="askSub"></small></div>
    </div>
    <form class="searchbox" id="searchForm">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off">
      <button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </form>
  </header>
  <div class="results" id="results"></div>
</section>

<div class="sheet-wrap hidden" id="sheet"><div class="sheet" id="sheetBody"></div></div>

<script>
(() => {
/* ------------------------------------------------------------ */
/* Κείμενα ΕΛ / EN                                               */
/* ------------------------------------------------------------ */
const T = {
  el: {
    cats: { all:"Όλα", fashion:"Μόδα", beauty:"Ομορφιά", health:"Υγεία & Ευεξία", products:"Νέα προϊόντα", saved:"Αποθηκευμένα" },
    ask:"Ρώτα τη WO", askSub:"Βρες άρθρα για ό,τι σε ενδιαφέρει",
    read:"Διάβασε το άρθρο", today:"Σήμερα", yesterday:"Χθες",
    summary:"Περίληψη", readFull:"Διάβασε όλο το άρθρο", sumNote:(s)=>`Απόσπασμα από το άρθρο του ${s}.`,
    archive:"Αρχείο", archiveSub:"Δες τα άρθρα προηγούμενων ημερών.",
    older:"Φόρτωση παλαιότερων…", noMore:"Είδες όλα τα άρθρα του αρχείου ✨", empty:"Δεν υπάρχουν ακόμα άρθρα εδώ.",
    newReels:n=>`↑ ${n} νέα άρθρα`, demo:"Δείγμα περιεχομένου", savedEmpty:"Πάτησε την καρδιά σε ένα άρθρο για να το αποθηκεύσεις.",
    settings:"Ρυθμίσεις", appLang:"Γλώσσα εφαρμογής", artLang:"Άρθρα από", artEl:"Ελληνικά site", artEn:"Ξένα περιοδικά", artAll:"Όλα", done:"OK",
    helloT:"Τι θέλεις να μάθεις;", helloP:"Γράψε μια ερώτηση ή διάλεξε ένα θέμα. Ο αριθμός δείχνει πόσα άρθρα υπάρχουν.",
    topics:[
      ["fashion","Τι να φορέσω σε χειμωνιάτικο γάμο"],
      ["beauty","Μακιγιάζ για τις γιορτές"],
      ["beauty","Περιποίηση για ξηρό δέρμα"],
      ["health","Άσκηση και διατροφή για ενέργεια"],
    ],
    placeholder:"π.χ. τι παλτό να διαλέξω", recent:"Πρόσφατες αναζητήσεις",
    noExact:"Δεν βρήκα άρθρο ακριβώς γι' αυτό.", related:"Σχετικά άρθρα",
    found:n=>`${n} άρθρα`, otherLang:"Από ξένα περιοδικά", otherLangEl:"Από ελληνικά site",
    none:"Δεν βρέθηκαν άρθρα. Δοκίμασε άλλες ή λιγότερες λέξεις.", offline:"Χρειάζεται σύνδεση στο internet.",
    layoutV:"Κάθετα", layoutH:"Οριζόντια", share:"Κοινοποίηση", save:"Αποθήκευση",
    ago:(m)=> m<60?`πριν ${m} λ.`:m<1440?`πριν ${Math.round(m/60)} ώ.`:`πριν ${Math.round(m/1440)} ημ.`,
  },
  en: {
    cats: { all:"All", fashion:"Fashion", beauty:"Beauty", health:"Health & Wellness", products:"New products", saved:"Saved" },
    ask:"Ask WO", askSub:"Find articles on anything you like",
    read:"Read the article", today:"Today", yesterday:"Yesterday",
    summary:"Summary", readFull:"Read the full article", sumNote:(s)=>`Excerpt from the ${s} article.`,
    archive:"Archive", archiveSub:"Browse articles from previous days.",
    older:"Loading older articles…", noMore:"You've seen the whole archive ✨", empty:"No articles here yet.",
    newReels:n=>`↑ ${n} new articles`, demo:"Sample content", savedEmpty:"Tap the heart on an article to save it.",
    settings:"Settings", appLang:"App language", artLang:"Articles from", artEl:"Greek sites", artEn:"International magazines", artAll:"All", done:"OK",
    helloT:"What would you like to know?", helloP:"Type a question or pick a topic. The number shows how many articles there are.",
    topics:[
      ["fashion","What to wear to a winter wedding"],
      ["beauty","Holiday makeup"],
      ["beauty","Care for dry skin"],
      ["health","Exercise and food for energy"],
    ],
    placeholder:"e.g. which coat to choose", recent:"Recent searches",
    noExact:"No article exactly on this.", related:"Related articles",
    found:n=>`${n} articles`, otherLang:"From international magazines", otherLangEl:"From Greek sites",
    none:"No articles found. Try different or fewer words.", offline:"You need an internet connection.",
    layoutV:"Vertical", layoutH:"Horizontal", share:"Share", save:"Save",
    ago:(m)=> m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`,
  },
};
const CAT_COLOR = { fashion:"var(--fashion)", beauty:"var(--beauty)", health:"var(--health)", products:"var(--products)" };
const CAT_GRAD = {
  fashion:"linear-gradient(160deg,#5a2f33,#c46d6a 60%,#e8a4a0)",
  beauty:"linear-gradient(160deg,#47263f,#b0699a 60%,#e6b3cf)",
  health:"linear-gradient(160deg,#21392f,#5f9b82 60%,#b9dcc9)",
  products:"linear-gradient(160deg,#4a3616,#c09042 60%,#ecd29e)",
};

/* ------------------------------------------------------------ */
/* Κατάσταση                                                     */
/* ------------------------------------------------------------ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("wo:"+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("wo:"+k, JSON.stringify(v)); }catch{} },
};
const startLang = store.get("lang", (navigator.language||"el").toLowerCase().startsWith("en") ? "en" : "el");
const S = {
  lang: startLang,
  articles: store.get("articles", startLang),   // "el" | "en" | "all"
  layout: store.get("layout", "vertical"),
  cat: "all",
  days: null, loaded: [], nextDay: undefined, loading: false,
  saved: store.get("saved", {}),
  recent: store.get("recent", []),
  base: "", demo: false,
};
const t = () => T[S.lang];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ------------------------------------------------------------ */
/* Δεδομένα (αρχεία JSON στο GitHub Pages)                       */
/* ------------------------------------------------------------ */
async function loadConfig(){
  try{ const r = await fetch("config.json", { cache:"no-cache" }); const c = await r.json(); S.base = (c.dataBase||"").trim(); }catch{}
  if(S.base && !S.base.endsWith("/")) S.base += "/";
  S.demo = !S.base;
}
async function getJSON(path, ms = 15000){
  const r = await fetch(S.base + path + (path.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now() / 120000), { signal:AbortSignal.timeout(ms) });
  if(!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function getDays(force){
  if(S.demo) return demoDays();
  if(!S.days || force) S.days = await getJSON("data/days.json");
  return S.days;
}
async function fetchDay(day, force){
  if(S.demo) return demoDay(day);
  const days = await getDays(force);
  if(!days.length) return { day:null, reels:[], prevDay:null };
  const d = day && days.includes(day) ? day : days[0];
  const reels = await getJSON("data/day/" + d + ".json");
  return { day:d, reels, prevDay:days[days.indexOf(d) + 1] || null };
}

/* ------------------------------------------------------------ */
/* Ροή άρθρων                                                    */
/* ------------------------------------------------------------ */
const langOK = (r) => S.articles === "all" || (r.lang || "en") === S.articles;
function allReels(){
  if(S.cat === "saved") return Object.values(S.saved).sort((a,b) => (b.savedAt||0) - (a.savedAt||0));
  const out = [];
  for(const d of S.loaded) for(const r of d.reels){
    if(langOK(r) && (S.cat === "all" || r.category === S.cat)) out.push(r);
  }
  return out;
}
function fmtDay(day){
  if(!day) return "";
  const iso = d => d.toLocaleDateString("en-CA");
  const today = new Date(); if(day === iso(today)) return t().today;
  const y = new Date(today); y.setDate(y.getDate()-1); if(day === iso(y)) return t().yesterday;
  return new Date(day + "T12:00:00").toLocaleDateString(S.lang === "el" ? "el-GR" : "en-GB", { weekday:"long", day:"numeric", month:"long" });
}
const ago = (iso) => t().ago(Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000)));

function reelHTML(r){
  const col = CAT_COLOR[r.category] || "var(--rose-deep)";
  const bg = r.image
    ? `<div class="bg" style="background-image:url('${esc(r.image)}')"></div>`

function renderFeed(keepScroll){
  const feed = $("feed");
  const pos = keepScroll ? (S.layout === "vertical" ? feed.scrollTop : feed.scrollLeft) : 0;
  feed.className = "feed" + (S.layout === "horizontal" ? " horizontal" : "");
  const reels = allReels();
  let html = reels.map(reelHTML).join("");
  if(S.cat === "saved"){ if(!reels.length) html = `<div class="end"><div>${t().savedEmpty}</div></div>`; }
  else if(S.nextDay === null) html += `<div class="end"><div>${reels.length ? t().noMore : t().empty}</div></div>`;
  else html += `<div class="end" id="sentinel"><div><div class="spinner"></div>${t().older}</div></div>`;
  feed.innerHTML = html;
  if(keepScroll){ S.layout === "vertical" ? (feed.scrollTop = pos) : (feed.scrollLeft = pos); }
  else { feed.scrollTop = 0; feed.scrollLeft = 0; }
  observeSentinel();
  updateDayLabel();
}

let io;
function observeSentinel(){
  io && io.disconnect();
  const s = $("sentinel"); if(!s) return;
  io = new IntersectionObserver((ents) => { if(ents.some(e => e.isIntersecting)) loadOlder(); }, { root:$("feed"), rootMargin:"200%" });
  io.observe(s);
}
async function loadOlder(){
  if(S.loading || S.nextDay === null) return;
  S.loading = true;
  try{
    const data = await fetchDay(S.nextDay);
    if(data.day && !S.loaded.some(d => d.day === data.day)) S.loaded.push({ day:data.day, reels:data.reels || [] });
    S.nextDay = data.prevDay || null;
    renderFeed(true);
    if(allReels().length < 3 && S.nextDay){ S.loading = false; return loadOlder(); }
  }catch{
    if(!S.loaded.length) $("feed").innerHTML = `<div class="end"><div>${t().offline}</div></div>`;
  } finally { S.loading = false; }
}
async function loadLatest(){
  S.loaded = []; S.nextDay = undefined;
  try{
    const data = await fetchDay(null, true);
    S.loaded = data.day ? [{ day:data.day, reels:data.reels || [] }] : [];
    S.nextDay = data.prevDay || null;
    store.set("feedCache", { loaded:S.loaded, nextDay:S.nextDay });
  }catch{
    const c = store.get("feedCache", null);
    if(c){ S.loaded = c.loaded; S.nextDay = c.nextDay; } else S.nextDay = null;
  }
  renderFeed();
  if(allReels().length < 3 && S.nextDay) loadOlder();
}
function updateDayLabel(){
  const feed = $("feed");
  let label = "";
  if(S.cat !== "saved"){
    const idx = S.layout === "vertical" ? Math.round(feed.scrollTop / (feed.clientHeight||1)) : Math.round(feed.scrollLeft / (feed.clientWidth||1));
    const r = allReels()[idx];
    const d = r ? S.loaded.find(d => d.reels.includes(r)) : S.loaded[0];
    if(d) label = fmtDay(d.day);
  }
  if(S.demo) label += (label ? " · " : "") + t().demo;
  $("dayLabel").textContent = label;
}

  "αντηλιακ ηλιο spf sunscreen",

const GROUPS = CONCEPTS.map(line => line.split(" ").map(norm));

const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Χωρίζει την ερώτηση σε έννοιες. Κάθε έννοια = λίστα από ρίζες (οποιαδήποτε αρκεί).
function concepts(q){
  const words = norm(q).split(/[^\p{L}\p{N}-]+/u).filter(w => (w.length > 2 || /\d/.test(w)) && !STOP.has(w));
  const out = [];
  for(const w of words){
    const g = GROUPS.find(stems => stems.some(s => s.length >= 3 && (w.startsWith(s) || (s.length >= 4 && s.startsWith(w)))));
    // λέξη χωρίς θέμα: κρατάμε τη ρίζα της («μαλλιά» → «μαλλ»)
    const own = w.length >= 6 ? w.slice(0, -2) : w.length === 5 ? w.slice(0, -1) : w;
    const stems = g || [own];
    const key = stems.join(" ");
    const ownRe = new RegExp(`(^|[^\\p{L}\\p{N}])${reEsc(own)}`, "u");
    const prev = out.find(c => c.key === key);
    // δύο λέξεις του ίδιου θέματος (π.χ. «κούρεμα καρέ»): μία έννοια, αλλά και οι δύο λέξεις ανεβάζουν τη σειρά
    if(prev) prev.own.push(ownRe);
    else out.push({ key, word: w, group: !!g, own: [ownRe], re: new RegExp(`(^|[^\\p{L}\\p{N}])(${stems.map(reEsc).join("|")})`, "u") });
  }
  return out;
}

// Επιστρέφει { exact: [...], related: [...] }
// Τα κείμενα των άρθρων σε μορφή αναζήτησης (υπολογίζονται μία φορά)
function normDocs(data){
  if(S.normFor !== data){
    S.normFor = data;
    S.normed = data.map(r => ({ r, title: norm(r.title), body: norm(r.excerpt), extra: norm(r.summary || "") }));
  }
  return S.normed;
}
const has = (c, d) => c.re.test(d.title) || c.re.test(d.body) || c.re.test(d.extra);

function searchIn(data, q){
  const cs = concepts(q);
  if(!cs.length) return { exact:[], related:[] };
  const docs = normDocs(data);
  const N = docs.length;
  for(const c of cs){
    let df = 0; for(const d of docs) if(has(c, d)) df++;
    // λέξη που δεν βρέθηκε πουθενά (π.χ. ορθογραφικό λάθος): δοκιμάζουμε πιο κοντή ρίζα
    if(!df && !c.group && c.word.length >= 6){
      const short = c.word.slice(0, Math.max(4, c.word.length - 3));
      c.re = new RegExp(`(^|[^\\p{L}\\p{N}])${reEsc(short)}`, "u");
      for(const d of docs) if(has(c, d)) df++;
    }
    // Σπάνιες έννοιες (π.χ. «γάμος») μετράνε περισσότερο από συχνές (π.χ. «χειμώνας»)
    c.w = Math.log((N + 1) / (df + 1)) + 0.1;
    c.df = df;
  }
  // έννοιες που δεν υπάρχουν σε κανένα άρθρο δεν μετράνε (αλλιώς δεν θα έβγαινε ποτέ τίποτα)
  const live = cs.filter(c => c.df > 0);
  if(!live.length) return { exact:[], related:[] };
  const total = live.reduce((s, c) => s + c.w, 0);
  const key = live.reduce((a, b) => (b.w > a.w ? b : a));   // η πιο «χαρακτηριστική» έννοια
  // λείπει θέμα που ζήτησε ρητά ο χρήστης (π.χ. «ξανθά»): τότε δεν υπάρχει «ακριβές» αποτέλεσμα.
  // Ρήματα/λέξεις χωρίς θέμα που δεν βρέθηκαν (π.χ. «χάσω») δεν εμποδίζουν.
  const missing = cs.filter(c => !c.df && c.group).length;
  // η βασική έννοια μόνη της αρκεί για «σχετικά» μόνο αν είναι σπάνια/συγκεκριμένη
  const specific = key.df <= Math.max(3, N * 0.03);
  const exact = [], related = [];
  for(const d of docs){
    let got = 0, n = 0, bonus = 0, hasKey = false;
    for(const c of live){
      const a = c.re.test(d.title), b = a || c.re.test(d.body);
      // λέξη μόνο μέσα στην περίληψη (όχι σε τίτλο/απόσπασμα): μετράει λιγότερο
      const x = !b && c.re.test(d.extra);
      if(b || x){ got += b ? c.w : c.w * 0.5; n++; if(a) bonus += c.w * 0.5; if(c === key && b) hasKey = true; }
      // η ίδια η λέξη της ερώτησης (όχι μόνο το θέμα της) μετράει επιπλέον
      for(const re of c.own){ if(re.test(d.title)) bonus += c.w * 0.8; else if(re.test(d.body)) bonus += c.w * 0.3; }
    }
    if(!n) continue;
    const cover = got / total;
    const ageDays = (Date.now() - Date.parse(d.r.published)) / 864e5;
    const score = got + bonus - ageDays * 0.01;
    if(!missing && cover >= 0.55 && (live.length === 1 || n >= 2)) exact.push({ score, r: d.r });
    else if((n >= 2 && cover >= 0.35) || (hasKey && (live.length === 1 || specific))) related.push({ score, r: d.r });
  }
  const by = (a, b) => b.score - a.score;
  return { exact: exact.sort(by).map(x => x.r), related: related.sort(by).map(x => x.r) };
}

function cardHTML(r){
  const thumb = r.image ? `background-image:url('${esc(r.image)}')` : `background:${CAT_GRAD[r.category]||CAT_GRAD.fashion}`;
  return `<button class="card" data-sum="${esc(r.id)}">

// q = τι ψάχνουμε, shown = τι γράφεται στο κουτί (για τα έτοιμα θέματα)
async function doSearch(q, shown){
  q = q.trim(); if(!q) return renderHello();
  $("q").value = shown || q; $("q").blur();
  if(!shown) S.recent = [q, ...S.recent.filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 6); store.set("recent", S.recent);
  $("results").innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  let data;
  try{ data = await loadSearchData(); }catch{ $("results").innerHTML = `<div class="none">${t().offline}</div>`; return; }
  const { exact, related } = searchIn(data, q);
  const split = (list) => S.articles === "all" ? [list, []] : [list.filter(langOK), list.filter(r => !langOK(r))];
  const section = (list, head, sep) => list.length ? `<div class="res-head ${sep ? "sep" : ""}">${head}</div>` + list.map(cardHTML).join("") : "";
  const otherHead = S.articles === "el" ? t().otherLang : t().otherLangEl;
  let html = "";
  if(exact.length){
    const [mine, other] = split(exact);
    html += section(mine.slice(0, 25), t().found(mine.length), false);
    if(mine.length < 8) html += section(other.slice(0, 12), otherHead, mine.length > 0);
  }
  if(exact.length < 4 && related.length){
    // Δεν υπάρχουν αρκετά άρθρα ακριβώς για την ερώτηση: δείχνουμε τα πιο κοντινά, με σαφή ένδειξη
    const [mine, other] = split(related);
    const list = [...mine, ...other].slice(0, 10);
    html += section(list, exact.length ? t().related : t().noExact + " " + t().related, exact.length > 0);
  }
  $("results").innerHTML = html || `<div class="none">${t().none}</div>`;
  $("results").scrollTop = 0;
}
$("searchForm").onsubmit = (e) => { e.preventDefault(); doSearch($("q").value); };
$("q").addEventListener("input", () => { if(!$("q").value) renderHello(); });
$("results").onclick = (e) => {
  const q = e.target.closest("[data-q]"); if(q) return doSearch(q.dataset.q);
  const tp = e.target.closest("[data-topic]");
  if(tp){ const x = TOPICS[+tp.dataset.topic]; return doSearch(x[3], S.lang === "el" ? x[1] : x[2]); }
  const s = e.target.closest("[data-sum]"); if(s) return openSummary(findReel(s.dataset.sum));
};

function demoReels(i){

    published:new Date(Date.now() - (i*24 + k + 1) * 3600e3).toISOString(),

function demoDay(day){
  const days = demoDays(); const d = day || days[0]; const i = Math.max(0, days.indexOf(d));
